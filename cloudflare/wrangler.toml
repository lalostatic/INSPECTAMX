name = "inspectamx-api"
main = "workers/api/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build:worker"
cwd = "."

[[d1_databases]]
binding = "DB"
database_name = "inspectamx"
database_id = "your-d1-database-id"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"

[[r2_buckets]]
binding = "R2"
bucket_name = "inspectamx-media"

[vars]
APP_URL = "https://inspectamx.com"
NODE_ENV = "production"

[env.development]
name = "inspectamx-api-dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "inspectamx-dev"
database_id = "your-dev-d1-database-id"

[[env.development.kv_namespaces]]
binding = "KV"
id = "your-dev-kv-namespace-id"

[[env.development.r2_buckets]]
binding = "R2"
bucket_name = "inspectamx-media-dev"

[env.development.vars]
APP_URL = "http://localhost:5173"
NODE_ENV = "development"
